services:
  backend:
    build: ./webresume
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot _certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    restart: unless-stopped
  
  certbot:
    image: certbot/certbot
    volumes:
      - certbot _certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  sqlite_data:
  certbot_certs:
  certbot_www: